<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUPATH - Đăng nhập</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body class="auth-page">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
    ☀️
</button>

    <button class="back-home" onclick="goHome()">
        <span>←</span>
        <span>Về trang chủ</span>
    </button>

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <div class="auth-logo-icon">E</div>
                <div>
                    <strong>EDUPATH</strong>
                    <small>Mỗi học sinh – một con đường học tập</small>
                </div>
            </div>

            <!-- ĐĂNG NHẬP -->

            <div id="loginForm">

                <h1>Chào mừng trở lại 👋</h1>

                <p class="auth-description">
                    Đăng nhập để tiếp tục hành trình học tập của bạn.
                </p>

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Nhập email của bạn"
                >

                <label>Mật khẩu</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Nhập mật khẩu"
                    >

                    <button
                        type="button"
                        onclick="togglePassword('loginPassword', this)"
                    >
                        👁
                    </button>

                </div>

                <button class="auth-submit" onclick="login()">
                    Đăng nhập
                </button>

                <p id="loginMessage" class="auth-message"></p>

                <div class="auth-switch">
                    Chưa có tài khoản?
                    <button onclick="showRegister()">
                        Đăng ký ngay
                    </button>
                </div>

            </div>


            <!-- ĐĂNG KÝ -->

            <div id="registerForm" style="display: none;">

                <h1>Tạo tài khoản 🚀</h1>

                <p class="auth-description">
                    Tạo tài khoản để lưu lại hành trình học tập của bạn.
                </p>

                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Nhập email của bạn"
                >

                <label>Mật khẩu</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Ít nhất 6 ký tự"
                    >

                    <button
                        type="button"
                        onclick="togglePassword('registerPassword', this)"
                    >
                        👁
                    </button>

                </div>

                <label>Nhập lại mật khẩu</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="registerPassword2"
                        placeholder="Nhập lại mật khẩu"
                    >

                    <button
                        type="button"
                        onclick="togglePassword('registerPassword2', this)"
                    >
                        👁
                    </button>

                </div>

                <button class="auth-submit" onclick="register()">
                    Tạo tài khoản
                </button>

                <p id="registerMessage" class="auth-message"></p>

                <div class="auth-switch">
                    Đã có tài khoản?
                    <button onclick="showLogin()">
                        Đăng nhập
                    </button>
                </div>

            </div>

        </div>

    </main>

<script>

function goHome() {
    window.location.href = "../index.html";
}

function showRegister() {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
}

function showLogin() {
    document.getElementById("registerForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
}

function togglePassword(id, button) {

    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        button.innerText = "🙈";
    } else {
        input.type = "password";
        button.innerText = "👁";
    }
}

function login() {

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    const message = document.getElementById("loginMessage");

    if (email === "" || password === "") {
        message.innerText = "Vui lòng nhập đầy đủ email và mật khẩu.";
        return;
    }

    message.innerText = "Đang đăng nhập...";

    // Firebase sẽ được kết nối ở bước tiếp theo
}

function register() {

    const email = document.getElementById("registerEmail").value.trim();
    const password = document.getElementById("registerPassword").value;
    const password2 = document.getElementById("registerPassword2").value;

    const message = document.getElementById("registerMessage");

    if (email === "" || password === "" || password2 === "") {
        message.innerText = "Vui lòng nhập đầy đủ thông tin.";
        return;
    }

    if (password.length < 6) {
        message.innerText = "Mật khẩu phải có ít nhất 6 ký tự.";
        return;
    }

    if (password !== password2) {
        message.innerText = "Mật khẩu nhập lại không giống nhau.";
        return;
    }

    message.innerText = "Đang tạo tài khoản...";

    // Firebase sẽ được kết nối ở bước tiếp theo
}

</script>
<script src="../theme.js"></script>
</body>
</html>
